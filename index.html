<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#020811" />
  <title>Ingeniero Espacial · Links</title>
  <meta name="description" content="Curiosidades del espacio contadas por un ingeniero de la ESA." />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />

  <style>
    :root{
      --cyan:#00ffe0;
      --bg:#020811;
      --white:#f5fbff;
      --muted:rgba(245,251,255,.86);
      --cyan-soft:rgba(0,255,224,.12);
      --cyan-glow:rgba(0,255,224,.35);
    }

    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}

    body{
      min-height:100svh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--white);
      background:var(--bg);
      overflow-x:hidden;
    }

    .space-bg{
      position:fixed;
      inset:0;
      z-index:-2;
      background:
        linear-gradient(180deg,rgba(0,5,12,.02) 0%,rgba(0,5,12,.06) 42%,rgba(0,5,12,.18) 100%),
        url("assets/space-bg.png") center top/cover no-repeat;
      transform:translateZ(0);
    }

    .space-bg::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 50% 42%,transparent 0 34%,rgba(0,4,10,.08) 60%,rgba(0,4,10,.35) 100%),
        linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.02) 58%,rgba(0,0,0,.08));
      pointer-events:none;
    }

    .page{
      width:min(760px,100%);
      height:100svh;
      min-height:100svh;
      margin:0 auto;
      padding:clamp(18px,3.2vh,40px) clamp(18px,4vw,32px);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:space-evenly;
      text-align:center;
      overflow:hidden;
    }

    .avatar-shell{
      width:clamp(126px,19vmin,184px);
      aspect-ratio:1;
      border-radius:50%;
      padding:3px;
      background:var(--cyan);
      box-shadow:
        0 0 0 1px rgba(0,255,224,.5),
        0 0 16px rgba(0,255,224,.46),
        0 0 34px rgba(0,255,224,.18);
      flex:0 0 auto;
    }

    .avatar-shell img{
      width:100%;
      height:100%;
      border-radius:50%;
      display:block;
      object-fit:cover;
      object-position:center;
      background:#04121d;
    }

    h1{
      margin:0;
      color:var(--cyan);
      font-size:clamp(30px,6.2vw,50px);
      line-height:1.04;
      font-weight:520;
      letter-spacing:-.035em;
      text-shadow:0 0 18px rgba(0,255,224,.18);
      white-space:nowrap;
    }

    .bio{
      max-width:580px;
      margin:0;
      color:var(--white);
      font-size:clamp(16px,2.8vw,23px);
      line-height:1.38;
      font-weight:360;
      text-shadow:0 2px 16px rgba(0,0,0,.88);
    }

    .accent-line{
      width:clamp(105px,19vw,145px);
      height:2px;
      margin:0 auto;
      border-radius:999px;
      background:var(--cyan);
      box-shadow:0 0 13px rgba(0,255,224,.62);
      opacity:.92;
    }

    .links{
      width:min(600px,92vw);
      margin:0;
      display:flex;
      flex-direction:column;
      gap:clamp(10px,1.7vh,16px);
    }

    .main-link{
      min-height:clamp(58px,7.7vh,76px);
      width:100%;
      display:grid;
      grid-template-columns:clamp(64px,11vw,86px) 1fr clamp(64px,11vw,86px);
      align-items:center;
      padding:0 clamp(10px,2.2vw,18px);
      border:1.5px solid var(--cyan);
      border-radius:clamp(18px,2.8vw,24px);
      color:var(--cyan);
      text-decoration:none;
      background:rgba(0,8,18,.14);
      box-shadow:
        inset 0 0 22px rgba(0,255,224,.012),
        0 0 18px rgba(0,255,224,.06);
      backdrop-filter:blur(2px);
      -webkit-backdrop-filter:blur(2px);
      transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
    }

    .main-link:hover{
      transform:translateY(-2px);
      background:rgba(0,255,224,.065);
      box-shadow:0 0 24px rgba(0,255,224,.16);
    }

    .main-link:active{transform:translateY(0)}

    .main-link .link-icon{
      width:clamp(38px,6vw,48px);
      height:clamp(38px,6vw,48px);
      display:flex;
      align-items:center;
      justify-content:center;
      justify-self:center;
      color:var(--cyan);
    }

    .main-link .link-icon svg{
      width:clamp(30px,4.8vw,38px);
      height:clamp(30px,4.8vw,38px);
      display:block;
      fill:none;
      stroke:currentColor;
      stroke-width:1.55;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .main-link .linkedin-icon svg{
      fill:currentColor;
      stroke:none;
      width:clamp(31px,5vw,39px);
      height:clamp(31px,5vw,39px);
    }

    .main-link strong{
      grid-column:2;
      font-size:clamp(22px,4vw,31px);
      line-height:1;
      font-weight:500;
      letter-spacing:-.025em;
      white-space:nowrap;
    }

    .network-divider{
      width:min(300px,55vw);
      height:1.5px;
      margin:0 auto;
      position:relative;
      background:linear-gradient(90deg,transparent,var(--cyan) 20%,var(--cyan) 80%,transparent);
      box-shadow:0 0 10px rgba(0,255,224,.28);
    }

    .network-divider::after{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:10px;
      height:10px;
      background:var(--cyan);
      transform:translate(-50%,-50%) rotate(45deg);
      box-shadow:0 0 13px rgba(0,255,224,.6);
    }

    .social-title{
      margin:0;
      font-size:clamp(18px,3vw,24px);
      font-weight:350;
      color:rgba(255,255,255,.95);
      text-shadow:0 2px 14px rgba(0,0,0,.85);
    }

    .socials{
      width:min(400px,86vw);
      margin:0;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:clamp(10px,3vw,20px);
    }

    .social-link{
      width:clamp(38px,6vw,48px);
      height:clamp(38px,6vw,48px);
      color:var(--cyan);
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      filter:drop-shadow(0 0 7px rgba(0,255,224,.12));
      transition:transform .16s ease,filter .16s ease;
    }

    .social-link:hover{
      transform:translateY(-2px) scale(1.04);
      filter:drop-shadow(0 0 10px rgba(0,255,224,.48));
    }

    .social-link svg{
      width:clamp(30px,5vw,39px);
      height:clamp(30px,5vw,39px);
      fill:currentColor;
      display:block;
    }

    .social-link.instagram svg{
      fill:none;
      stroke:currentColor;
      stroke-width:2;
      stroke-linecap:round;
      stroke-linejoin:round;
    }

    .social-link.substack svg{
      width:clamp(29px,4.8vw,37px);
      height:clamp(29px,4.8vw,37px);
    }

    @media (max-width:560px){
      .page{
        padding-left:clamp(14px,4.8vw,20px);
        padding-right:clamp(14px,4.8vw,20px);
      }
      .avatar-shell{width:clamp(112px,35vw,146px)}
      h1{font-size:clamp(28px,8.8vw,38px)}
      .bio{font-size:clamp(14px,4.25vw,17px);max-width:92vw}
      .links{width:min(560px,90vw)}
      .main-link{grid-template-columns:clamp(52px,16vw,66px) 1fr clamp(52px,16vw,66px)}
      .main-link strong{font-size:clamp(20px,6.4vw,25px)}
      .socials{width:min(340px,84vw)}
    }

    @media (max-width:390px){
      h1{font-size:clamp(25px,8.1vw,31px)}
      .bio{font-size:clamp(13px,4vw,15px)}
      .links{width:88vw}
      .main-link strong{font-size:clamp(18px,5.8vw,22px)}
      .social-title{font-size:17px}
    }

    /* En pantallas bajas reducimos proporcionalmente, sin comprimir todos los espacios a cero. */
    @media (max-height:760px){
      .page{padding-top:10px;padding-bottom:10px}
      .avatar-shell{width:clamp(96px,16vh,124px)}
      h1{font-size:clamp(25px,4.5vh,34px)}
      .bio{font-size:clamp(13px,2.25vh,16px);line-height:1.3}
      .links{gap:8px}
      .main-link{min-height:clamp(50px,7.3vh,58px)}
      .main-link strong{font-size:clamp(18px,3.4vh,23px)}
      .main-link .link-icon{width:34px;height:34px}
      .main-link .link-icon svg,.main-link .linkedin-icon svg{width:28px;height:28px}
      .social-title{font-size:16px}
      .social-link{width:34px;height:34px}
      .social-link svg{width:27px;height:27px}
      .social-link.substack svg{width:26px;height:26px}
    }

    @media (max-height:640px){
      .avatar-shell{width:88px}
      h1{font-size:24px}
      .bio{font-size:12px}
      .main-link{min-height:46px;border-radius:14px}
      .main-link strong{font-size:18px}
      .social-title{font-size:14px}
      .socials{width:min(300px,82vw)}
    }

    @media (prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important;transition:none!important}
    }
  </style>
</head>

<body>

</body>
</html>
